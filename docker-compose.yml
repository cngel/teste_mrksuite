services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    networks:
      - ms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - ms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  modular-monolith:
    build:
      context: .
      dockerfile: modular_monolith/Dockerfile
    container_name: ms_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      ms_network:
        aliases:
          - web-service

  whatsapp-webhook:
    build:
      context: .
      dockerfile: whatsapp-service/Dockerfile.node
    container_name: ms_whatsapp_webhook
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ms_network
    depends_on:
      postgres:
        condition: service_healthy

  # Serviços internos mapeados localmente para o Nginx via 127.0.0.1.
  # Não são alcançáveis diretamente a partir do host externo (Internet).
  auth-service:
    build: ./auth-service
    profiles: ["microservices"]
    container_name: ms_auth
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - ms_network
    depends_on:
      postgres:
        condition: service_healthy

  crm-service:
    build: ./crm-service
    profiles: ["microservices"]
    container_name: ms_crm
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      - ms_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  rh-service:
