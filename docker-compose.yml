    profiles: ["microservices"]
    container_name: ms_rh
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5003:5003"
    networks:
      - ms_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

