name: CI

on:
  push:
    branches: [main, sudo, julio]
  pull_request:
    branches: [main, sudo, julio]

jobs:
  erp-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes do erp-agent (Kora)
        run: make test

  validate-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir e validar todos os microserviços
        run: make ci-validate
