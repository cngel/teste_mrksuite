# Stack dedicado a CI/CD e validação autónoma — separado do
# docker-compose.yml de desenvolvimento:
#   - usa .env.ci (valores fictícios, seguro para commitar), nunca .env real
#   - não publica portas no host, para não colidir com um stack de dev já
#     a correr na mesma máquina — tudo se valida de dentro da rede ci_network
#     (ver scripts/ci_smoke_test.sh, correndo através do serviço "validator")
#   - dados efémeros (tmpfs), pensado para subir, validar e deitar abaixo
#
# Uso: `make ci` (ver Makefile) ou diretamente:
#   docker compose -f docker-compose.ci.yml --env-file .env.ci up -d --build
#   docker compose -f docker-compose.ci.yml --env-file .env.ci run --rm validator
#   docker compose -f docker-compose.ci.yml --env-file .env.ci down -v

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - ci_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    tmpfs:
      - /data
    networks:
      - ci_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - ci_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  modular-monolith:
    build:
      context: .
      dockerfile: modular_monolith/Dockerfile
    env_file: .env.ci
    networks:
      - ci_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    profiles: ["microservices"]
    env_file: .env.ci
    networks:
      - ci_network
    depends_on:
      postgres:
        condition: service_healthy

  crm-service:
    build: ./crm-service
    profiles: ["microservices"]
    env_file: .env.ci
    networks:
      - ci_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  rh-service:
    build: ./rh-service
    profiles: ["microservices"]
    env_file: .env.ci
    networks:
      - ci_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

