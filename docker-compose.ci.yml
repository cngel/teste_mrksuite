#      postgres:
#        condition: service_healthy
#      minio:
#        condition: service_healthy

  documents-service:
    build: ./documents-service
    profiles: ["microservices"]
    env_file: .env.ci
    networks:
      - ci_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  accounting-service:
    build: ./accounting-service
    profiles: ["microservices"]
    env_file: .env.ci
    networks:
      - ci_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  stock-service:
    build: ./stock-service
    profiles: ["microservices"]
    env_file: .env.ci
    networks:
      - ci_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web-service:
    build: ./web-service
    profiles: ["microservices"]
    env_file: .env.ci
    networks:
      - ci_network
    depends_on:
      - auth-service
      - crm-service
      - rh-service
      #- finance-service
