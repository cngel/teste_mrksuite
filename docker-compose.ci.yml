  # Container "autónomo" que corre dentro da ci_network para validar que
  # todos os serviços arrancaram bem (ver scripts/ci_smoke_test.sh). Não
  # sobe com `up`; só é invocado com `run --rm validator` (ver Makefile).
  validator:
    image: curlimages/curl:8.11.0
    networks:
      - ci_network
    entrypoint: ["sh", "/scripts/ci_smoke_test.sh"]
    volumes:
      - ./scripts/ci_smoke_test.sh:/scripts/ci_smoke_test.sh:ro
    profiles:
      - tools

networks:
  ci_network:
    driver: bridge
